name: Build and Publish

on:
  push:
    branches:
      - master
      - main
      - develop
  workflow_dispatch:

jobs:
  build:
    uses: mikopbx/.github-workflows/.github/workflows/extension-publish.yml@master
    with:
      initial_version: "1.0"
      custom_build_steps: |
        cd module/react-app
        npm ci
        npm run build
        test -f ../public/assets/js/vendor/react-flow.bundle.js
        rm -rf node_modules
    secrets: inherit
